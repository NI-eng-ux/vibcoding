name: Auto Update Vibcoding Data

# ============================================================
# 每 2 天自动触发 (UTC 00:00)，也可手动触发
# 调用 update-data.js 脚本:
#   1. 从 GitHub API 获取最新 Star 数
#   2. 更新 data.json（唯一数据源，浏览器通过 fetch 加载）
# ============================================================

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行更新脚本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node update-data.js

      - name: 检查 data.json 是否有变更
        id: check_changes
        run: |
          if git diff --quiet data.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📭 数据无变更，跳过提交。"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 检测到数据变更："
            git diff --stat data.json
          fi

      - name: 提交并推送 data.json
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "📊 Auto update: refresh star counts in data.json ($(date +%Y-%m-%d)) [skip ci]"
          git push
          echo "🚀 data.json 已更新并推送！"
